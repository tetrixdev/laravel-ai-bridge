name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release trigger runs the same test/lint jobs so tests pass before tagging.
  release:
    types: [published]

jobs:
  test:
    name: Test (PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pin testbench to the line that matches the Laravel major: testbench 9
        # tracks Laravel 11, testbench 10 tracks Laravel 12. Without this, the
        # unconstrained ^9.0|^10.0 dev range resolves to testbench 10 even on the
        # Laravel-11 rows, which drags in laravel/framework 12 and conflicts with
        # the pinned illuminate/support 11 (framework *replaces* that package).
        include:
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, openssl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --colors=always

  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax
        run: find src -name "*.php" -exec php -l {} \;
